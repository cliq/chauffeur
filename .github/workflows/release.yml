name: Release

# Push a vX.Y[.Z] tag to publish a notarized DMG to GitHub Releases. A manual run
# from a branch rehearses the same build and notarization, keeps the DMG as a
# workflow artifact, and publishes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag and configuration
        id: version
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo '::error::Release tags must look like v0.1.0 (or v0.1).'
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
            publish=true
          else
            version=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)
            publish=false
            echo "::notice::Rehearsal of $version from $GITHUB_REF_NAME; nothing will be published."
          fi
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD TEAM_ID \
            NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret or variable: $name"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app; do
            if [[ -d "$candidate" ]]; then sudo xcode-select -s "$candidate"; break; fi
          done
          xcodebuild -version
          test "$(uname -m)" = arm64
          brew install xcodegen create-dmg

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          cert_path="$RUNNER_TEMP/developer_id.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null
          rm -f "$cert_path"

      - name: Build, notarize, and staple app and DMG
        env:
          CHAUFFEUR_TEAM_ID: ${{ vars.TEAM_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          CHAUFFEUR_NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          CHAUFFEUR_NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          export CHAUFFEUR_NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$CHAUFFEUR_NOTARY_KEY_PATH"
          Scripts/distribute.sh "$RELEASE_VERSION" "$GITHUB_RUN_NUMBER"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chauffeur-dmg
          path: dist/Chauffeur.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s dist/Chauffeur.dmg
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          for attempt in 1 2 3 4; do
            if gh release upload "$GITHUB_REF_NAME" dist/Chauffeur.dmg --clobber; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "::warning::Release upload attempt $attempt failed; retrying."
              sleep "$((attempt * 10))"
            fi
          done
          echo '::error::Release upload failed after four attempts. The DMG is saved as a workflow artifact.'
          exit 1

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-diagnostics
          path: build/notarization*.json
          if-no-files-found: ignore

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/AuthKey.p8"
