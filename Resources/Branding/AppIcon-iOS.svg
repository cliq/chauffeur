      <stop offset="0.52" stop-color="#b65b2c"/>
      <stop offset="1" stop-color="#854023"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3e4d1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#copper)"/>
  <g transform="translate(64.557 64.557) scale(3.495652)" fill="url(#ivory)">
