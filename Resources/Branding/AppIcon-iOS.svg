<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Chauffeur iOS app icon</title>
  <desc>Full-bleed variant of the copper app icon for iOS, which masks and rounds the corners itself. Same cap geometry and gradient as AppIcon.svg, scaled so the cap keeps the proportion it has inside the macOS tile.</desc>
