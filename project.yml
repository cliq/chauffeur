name: Chauffeur
options:
  bundleIdPrefix: dev.cliq.chauffeur
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  Chauffeur:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      CHAUFFEUR_BUNDLE_SUFFIX: .debug
      CHAUFFEUR_DISPLAY_NAME: Chauffeur Debug
      CHAUFFEUR_URL_SCHEME: chauffeur-debug
    Release:
      # `make release` uses build, which otherwise injects the debug entitlement.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CHAUFFEUR_BUNDLE_SUFFIX: ""
      CHAUFFEUR_DISPLAY_NAME: Chauffeur
      CHAUFFEUR_URL_SCHEME: chauffeur
targets:
  ChauffeurApp:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - Sources/ChauffeurApp
      - Sources/ChauffeurSharedUI
    dependencies:
      - package: Chauffeur
        product: ChauffeurCore
      - package: Chauffeur
        product: ChauffeurTerminalInterface
      - package: Chauffeur
        product: ChauffeurTerminalGhostty
    info:
      path: .build/generated/Chauffeur-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.chauffeur.session
            CFBundleURLSchemes: ["$(CHAUFFEUR_URL_SCHEME)"]
    settings:
      base:
        PRODUCT_NAME: Chauffeur
        WRAPPER_NAME: $(CHAUFFEUR_DISPLAY_NAME).app
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)$(CHAUFFEUR_BUNDLE_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(CHAUFFEUR_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: 3
    postBuildScripts:
      - name: Embed background runtime
        script: '"$SRCROOT/Scripts/embed-runtime.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/ChauffeurRuntime"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/chauffeurctl"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/chauffeur-launcher"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/ChauffeurNotifications.app"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/ChauffeurSessions.app"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/dev.chauffeur.runtime.plist"
          - "$(TARGET_BUILD_DIR)/Chauffeur.signing-identity"
  ChauffeurAppUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - Tests/ChauffeurAppUITests
    dependencies:
      - target: ChauffeurApp
      - package: Chauffeur
        product: ChauffeurCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)$(CHAUFFEUR_BUNDLE_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChauffeurApp
        ENABLE_HARDENED_RUNTIME: NO
  ChauffeurMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - Sources/ChauffeurMobile
      - Sources/ChauffeurSharedUI
    dependencies:
      - package: Chauffeur
        product: ChauffeurRemoteProtocol
      - package: Chauffeur
        product: ChauffeurRemoteClient
      - package: Chauffeur
        product: ChauffeurTerminalInterface
      - package: Chauffeur
        product: ChauffeurTerminalSwiftTerm
      - package: Chauffeur
        product: ChauffeurTerminalTesting
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Chauffeur
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).mobile$(CHAUFFEUR_BUNDLE_SUFFIX)
        # iOS cannot use the Developer ID identity the Mac service is signed with.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(CHAUFFEUR_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Chauffeur connects to your Mac on this network to list its sessions and use their terminals.
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: 1
  ChauffeurMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/ChauffeurMobileTests
      - path: Sources/ChauffeurCore/Resources/Skills/implementation-progress/assets/index.html
        buildPhase: resources
    dependencies:
      - target: ChauffeurMobile
      - package: Chauffeur
        product: ChauffeurRemoteProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cliq.chauffeur.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chauffeur.app/Chauffeur"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Chauffeur:
    build:
      targets:
        ChauffeurApp: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ChauffeurAppUITests
      environmentVariables:
        CHAUFFEUR_TEST_APP: "$(BUILT_PRODUCTS_DIR)/$(CHAUFFEUR_DISPLAY_NAME).app"
  ChauffeurMobile:
    build:
      targets:
        ChauffeurMobile: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ChauffeurMobileTests
